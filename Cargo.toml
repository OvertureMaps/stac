[package]
name = "overture-stac"
version = "5.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Francisco Jiménez <jjcfrank@gmail.com>"]
description = "Overture Maps STAC catalog generator — CLI and library for building, validating, and reconciling STAC catalogs against the Overture data bucket"
license = "MIT"
repository = "https://github.com/OvertureMaps/stac"
homepage = "https://stac.overturemaps.org"
documentation = "https://docs.rs/overture-stac"
readme = "README.md"
keywords = ["stac", "overture", "geospatial", "catalog", "cli"]
categories = ["command-line-utilities", "science::geo"]
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/build.rs",
]

[lib]
name = "overture_stac"
crate-type = ["rlib"]

[[bin]]
name = "overture-stac"
path = "src/main.rs"

[dependencies]
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
num_cpus = "1"
# parquet, object_store and the arrow dev-deps track the majors the stac crates
# use (parquet 58), so one arrow stack builds. Move them together once
# stac-utils/rustac#1130 ships; .github/dependabot.yml ignores newer majors.
object_store = { version = "0.13", features = ["aws", "gcp", "azure", "http"] }
parquet = { version = "58", features = ["async", "object_store"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
stac = { version = "0.17.4", features = ["geoparquet"] }
stac-io = { version = "0.3.2", features = ["geoparquet"] }
stac-validate = "0.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
arrow-array = "58"
arrow-schema = "58"
assert_cmd = "2"
jsonschema = "0.59"
predicates = "3"

# Fixture generator for the offline stac-validate CI job. Writes a minimal
# Overture-shaped tree (one release / one theme / one type / one parquet, plus
# a registry parquet) that `setup-garage` uploads and `overture-stac build`
# reads. Not part of the shipped CLI.
[[example]]
name = "gen_fixture"
path = "examples/gen_fixture.rs"
