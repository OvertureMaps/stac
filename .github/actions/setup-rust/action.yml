---
name: Setup Rust
description: >
  Install a Rust toolchain and (optionally) restore the Swatinem/rust-cache
  build cache. Single source of truth for the toolchain used across every Rust
  workflow in this repo, so no job silently drifts to the runner default.

inputs:
  toolchain:
    description: 'Rust toolchain to install (e.g. "stable", "1.88.0"). Use "none" to skip the install.'
    required: false
    default: stable
  cache-key:
    description: Cache key suffix passed to Swatinem/rust-cache. Empty disables caching.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - if: inputs.toolchain != 'none'
      name: Install toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: rustup update "$TOOLCHAIN" && rustup default "$TOOLCHAIN"

    - if: inputs.cache-key != ''
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
