name: Setup DuckDB CLI
description: Install a pinned DuckDB CLI (linux-amd64) and put it on PATH. Used to write latest.ddb.

inputs:
  version:
    description: DuckDB release tag. Empty uses the pin in .github/scripts/setup-duckdb.sh.
    default: ''
  sha256:
    description: SHA-256 of duckdb_cli-linux-amd64.zip for the version. Empty uses the pinned one.
    default: ''

runs:
  using: composite
  steps:
    - name: Install DuckDB CLI
      shell: bash
      env:
        DUCKDB_VERSION: ${{ inputs.version }}
        DUCKDB_SHA256: ${{ inputs.sha256 }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/setup-duckdb.sh"
