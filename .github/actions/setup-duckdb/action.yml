name: Setup DuckDB CLI
description: Install a pinned DuckDB CLI (linux-amd64) and put it on PATH. Used to write latest.ddb.

inputs:
  version:
    description: DuckDB release tag.
    default: v1.4.5
  sha256:
    description: SHA-256 of duckdb_cli-linux-amd64.zip for the pinned version.
    default: ff4ef9ec59fe3e1a1f3dd1004c6218d1fd59c0533c185c968c4403fd0240d02b

runs:
  using: composite
  steps:
    - name: Install DuckDB CLI
      shell: bash
      env:
        DUCKDB_VERSION: ${{ inputs.version }}
        DUCKDB_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        dest="$RUNNER_TEMP/duckdb"
        mkdir -p "$dest"
        curl -fsSL --retry 3 -o "$dest/duckdb.zip" \
          "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
        echo "${DUCKDB_SHA256}  $dest/duckdb.zip" | sha256sum -c -
        unzip -q "$dest/duckdb.zip" -d "$dest"
        echo "$dest" >> "$GITHUB_PATH"
