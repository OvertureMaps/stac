---
name: Release Rust

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  PULL_REQUESTER_ROLE_ARN: arn:aws:iam::816069134238:role/gha-pull-requester-secrets-reader

jobs:
  release-pr:
    name: Release PR
    if: github.repository == 'OvertureMaps/stac'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchange with AWS to read the app PEM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # zizmor: ignore[superfluous-actions,stale-action-refs]

      - name: Configure AWS credentials (app PEM read)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PULL_REQUESTER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch overture-pull-requester PEM from Secrets Manager
        # Exports the PEM as env.PULL_REQUESTER_APP_PEM, masked (incl. multi-line).
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            PULL_REQUESTER_APP_PEM, omf-github-terraform/pull-requester/pem

      # release-plz acts as overture-pull-requester[bot] rather than via
      # GITHUB_TOKEN: events created with GITHUB_TOKEN start no workflow, so the
      # release PR would never report the required checks, and the DCO check
      # skips bot commits (release-plz can't write a Signed-off-by trailer).
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liiN80WEARreTV7m # https://github.com/apps/overture-pull-requester
          private-key: ${{ env.PULL_REQUESTER_APP_PEM }}
          owner: OvertureMaps
          repositories: stac
          permission-contents: write # push the release-plz release branch
          permission-pull-requests: write # open/update the release PR

      # Nothing below needs either, and release-plz pulls in nested actions.
      - name: Drop the PEM and AWS credentials
        run: |
          {
            echo "PULL_REQUESTER_APP_PEM="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"

      - name: release-plz release-pr
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    name: Release
    if: github.repository == 'OvertureMaps/stac'
    needs: release-pr
    runs-on: ubuntu-latest
    # Approval gate before publishing to crates.io. The trusted publisher
    # config on crates.io must scope to this same environment name.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC: AWS for the app PEM, crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # zizmor: ignore[superfluous-actions,stale-action-refs]

      - name: Configure AWS credentials (app PEM read)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PULL_REQUESTER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch overture-pull-requester PEM from Secrets Manager
        # Exports the PEM as env.PULL_REQUESTER_APP_PEM, masked (incl. multi-line).
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            PULL_REQUESTER_APP_PEM, omf-github-terraform/pull-requester/pem

      # Same reasoning as release-pr: a GITHUB_TOKEN-created release fires no
      # `release: published` event downstream.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liiN80WEARreTV7m # https://github.com/apps/overture-pull-requester
          private-key: ${{ env.PULL_REQUESTER_APP_PEM }}
          owner: OvertureMaps
          repositories: stac
          permission-contents: write # push the v* tag, create the GitHub Release
          permission-pull-requests: write # comment the release back on the PR

      # Nothing below needs either, and release-plz pulls in nested actions.
      - name: Drop the PEM and AWS credentials
        run: |
          {
            echo "PULL_REQUESTER_APP_PEM="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: release-plz release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
