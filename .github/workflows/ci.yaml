name: CI

permissions:
  contents: read

# Clippy and a release build sanity check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features

      - name: test
        run: cargo test --all-features

      - name: doc
        run: cargo doc --no-deps --all-features

      - name: build (release)
        run: cargo build --release

  msrv:
    name: MSRV (build on declared rust-version)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep -oE '^rust-version = "[^"]+"' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" build --locked

  python:
    name: Python bindings (maturin build + pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: python-bindings

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Build extension
        run: uv run maturin develop --release --features python,extension-module

      - name: Smoke test
        run: uv run python -c "import overture_stac; print(dir(overture_stac))"

      - name: pytest
        run: uv run pytest

  stac-validate:
    name: STAC validation (build + validate against public bucket)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: stac-validate

      - name: Build sample catalog and validate
        run: cargo run --release -- build --debug --output tmp/ --validate

  stac-validate-offline:
    name: STAC validation (fabricated fixture in Garage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: stac-validate-offline

      - uses: lowlydba/setup-garage@4541bf2220810f325afe59324046f8278a1b477a # v1.0.0
        with:
          bucket: overture-test

      - name: Generate fixture
        run: cargo run --example gen_fixture --release -- /tmp/fixture

      - name: Upload fixture to Garage
        run: aws s3 sync /tmp/fixture s3://overture-test/ --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Build against Garage bucket
        run: |
          cargo run --release -- build \
            --data-uri s3://overture-test \
            --extras-uri "" \
            --root-href https://example.com/stac \
            --output /tmp/out

      - name: Validate (schema + links only)
        run: |
          cargo run --release -- validate /tmp/out --no-overture-rules

  all-checks-pass:
    name: All Checks Pass
    needs: [rust, msrv, python, stac-validate, stac-validate-offline]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - uses: lowlydba/are-we-good@0f90ea9fa5e47188fcb69d9306fb8b3abb656018 # v1.2.0
        with:
          jobs: ${{ toJSON(needs) }}
