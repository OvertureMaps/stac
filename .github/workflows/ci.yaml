name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          uv pip install --system ruff

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run ruff linting
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run tests
        run: |
          uv run pytest

  test-package-install:
    name: Test Package Installation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install package
        run: |
          uv pip install --system -e .

      - name: Test CLI availability
        run: |
          which gen-stac || echo "CLI not found in PATH, checking if it's installed..."
          python -c "from overture_stac import OvertureRelease, RegistryManifest; print('Package imports successfully')"

      - name: Test imports
        run: |
          python -c "from overture_stac.overture_stac import OvertureRelease; print('OvertureRelease imported')"
          python -c "from overture_stac.registry_manifest import RegistryManifest; print('RegistryManifest imported')"

  stac-validate:
    name: STAC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Generate local STAC catalog (debug mode)
        run: uv run python tests/setup_test_catalog.py --output "$GITHUB_WORKSPACE/tests/data" --workers 2

      - name: Serve STAC catalog locally
        run: |
          uv run python tests/setup_test_catalog.py --serve-only --output "$GITHUB_WORKSPACE/tests/data" &
          echo $! > server.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8888/catalog.json > /dev/null && break
            sleep 0.5
          done

      # TEMP: A/B timing comparison for OvertureMaps/stac#112. Runs validation twice,
      # once with the current fast-linting mode and once with fast (skips linting
      # too), so this PR's CI run gives us real numbers before switching the
      # publish-catalog.yaml gate over. Remove the fast-linting step once we've
      # measured a few runs.
      - name: Validate root catalog (fast-linting, baseline)
        uses: OvertureMaps/stac-check-action@71e219583b4fd87f797bac5840b088c048116765 # v1.1.0
        with:
          stac-check-version: "1.14.0"
          file: http://127.0.0.1:8888/catalog.json
          recursive: "true"
          fast-linting: "true"
          job-summary: "true"

      - name: Validate root catalog (fast, candidate)
        uses: OvertureMaps/stac-check-action@71e219583b4fd87f797bac5840b088c048116765 # v1.1.0
        with:
          stac-check-version: "1.14.0"
          file: http://127.0.0.1:8888/catalog.json
          recursive: "true"
          fast: "true"
          job-summary: "true"

      - name: Stop local server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

  all-checks-pass:
    name: All Checks Pass
    needs: [lint, test, test-package-install, stac-validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
        with:
          jobs: ${{ toJSON(needs) }}
