name: CI

permissions:
  contents: read

# Clippy and a release build sanity check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, doc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: rust

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features

      - name: doc
        run: cargo doc --no-deps --all-features

  # Build, test (project toolchain + rust-version MSRV leg), cargo-audit,
  # SBOM and Grype. Workflow-level env (RUSTFLAGS) doesn't reach it.
  build-test:
    name: Build/Test
    permissions:
      contents: read
      pull-requests: read # repository-metadata-action queries PR data
      issues: read # grype-scan-action reads cve-bypass issues
    uses: lfreleng-actions/rust-workflows/.github/workflows/build-test.yaml@b7905deb2c3a5d8acd802db3769af51b1100fb50 # v0.1.0
    with:
      all_features: true
      test_matrix: msrv
      setup_script: .github/scripts/setup-duckdb.sh
      harden_runner_egress: block
      grype_remediation_window_start: '2026-10-30'
      # zstd 0.13 / zstd-safe 7 arrive via parquet 58 from the stac crates;
      # the fix needs parquet 60 there (stac-utils/rustac#1130). Drop once
      # a stac release ships it.
      audit_ignore_vulns: >-
        RUSTSEC-2026-0391
        RUSTSEC-2026-0398
        RUSTSEC-2026-0403

  stac-validate:
    name: STAC validation (build + validate against public bucket)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: stac-validate

      - name: Build sample catalog and validate
        run: cargo run --release -- build --debug --output tmp/ --validate

  stac-validate-offline:
    name: STAC validation (fabricated fixture in Garage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          cache-key: stac-validate-offline

      - uses: lowlydba/setup-garage@4541bf2220810f325afe59324046f8278a1b477a # v1.0.0
        with:
          bucket: overture-test

      - name: Generate fixture
        run: cargo run --example gen_fixture --release -- /tmp/fixture

      - name: Upload fixture to Garage
        run: aws s3 sync /tmp/fixture s3://overture-test/ --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Build against Garage bucket
        run: |
          cargo run --release -- build \
            --data-uri s3://overture-test \
            --extras-uri "" \
            --root-href https://example.com/stac \
            --output /tmp/out

      - name: Validate (schema + links only)
        run: |
          cargo run --release -- validate /tmp/out --no-overture-rules

  all-checks-pass:
    name: All Checks Pass
    needs: [rust, build-test, stac-validate, stac-validate-offline]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
