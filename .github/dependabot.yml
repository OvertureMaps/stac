---
version: 2
updates:

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types:
          - "major"
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "bot"
    commit-message:
      prefix: "[CHORE](gha-deps)"
      include: "scope"

  # Maintain Rust crate dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Held to the parquet/arrow/object_store majors the stac crates use, so
    # one arrow stack builds. Lift with stac-utils/rustac#1130.
    ignore:
      - dependency-name: "parquet"
        versions: [">=59"]
      - dependency-name: "arrow-*"
        versions: [">=59"]
      - dependency-name: "object_store"
        versions: [">=0.14"]
    groups:
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "bot"
    commit-message:
      prefix: "[CHORE](cargo-deps)"
      include: "scope"
