[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "overture-stac"
description = "Generate STAC catalogs for Overture Maps releases (Rust core with Python bindings)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
keywords = ["stac", "overture", "geospatial", "geoparquet"]
dynamic = ["version"]
dependencies = []

[project.urls]
Repository = "https://github.com/OvertureMaps/stac"
Issues = "https://github.com/OvertureMaps/stac/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.maturin]
# Enable the python cfg-gated code + skip libpython linking (needed for wheels
# on Linux/macOS). Building the wheel picks up both automatically.
features = ["python", "extension-module"]
python-source = "python"
module-name = "overture_stac.overture_stac"
strip = true

[dependency-groups]
dev = [
    "maturin>=1.15.0,<2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional-monorepo"
allow_zero_version = true
major_on_zero = true
build_command = ""

[tool.semantic_release.commit_parser_options]
path_filters = ["src/python.rs", "python/**", "pyproject.toml"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote]
type = "github"
